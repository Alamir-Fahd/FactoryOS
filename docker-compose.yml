version: '3.8'

services:
  # 1. The Full-Stack Next.js Web App
  web:
    build:
      context: ./web
      dockerfile: ../infra/nextjs.Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - mongodb
    networks:
      - factory-network

  # 2. The MongoDB Database
  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-innovera123}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - factory-network

  # 3. Mongo Express (GUI to see your data at localhost:8081)
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-innovera123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-innovera123}@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - factory-network

networks:
  factory-network:
    driver: bridge

volumes:
  mongo_data:
